name: stale

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: bug,security,pinned
          exempt-pr-labels: pinned
          stale-issue-message: This issue has had no activity for 60 days. It will be closed in 14 days unless there is new activity.
          stale-pr-message: This pull request has had no activity for 60 days. It will be closed in 14 days unless there is new activity.
