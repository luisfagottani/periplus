name: ci

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # publint inspects the packed tarball, so dist/ must exist.
      - run: pnpm build
      - run: pnpm lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke

  compat:
    # The toolchain (tsdown, Vitest, Changesets) needs Node 22+, so the bundle is
    # built on Node 24 and exercised on the oldest supported runtime.
    name: compat (node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/smoke.mjs

  site:
    # Builds the Starlight hub that `init` scaffolds, on the oldest Node major it
    # supports (Astro needs >=22.12).
    name: site (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-site.mjs

  changeset:
    name: changeset
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' && github.head_ref != 'changeset-release/next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Warn when the package changes without a changeset
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --quiet "$base"...HEAD -- src templates skills package.json; then
            echo "No package changes."
          elif ! pnpm changeset status --since="$base" >/dev/null 2>&1; then
            echo "::warning title=Missing changeset::This PR changes the published package but has no changeset. Run \`pnpm changeset\`."
          fi
