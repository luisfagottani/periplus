name: Bug report
description: Something does not work as documented
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please search existing issues first.
  - type: input
    id: version
    attributes:
      label: Periplus version
      description: Output of `npx periplus --version` or the version in your lockfile.
      placeholder: 0.0.1
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v24.19.0
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      placeholder: npx periplus check --fail-on error
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Relevant output (e.g. `periplus check`), stack traces or generated files.
      render: shell
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A repository, or the smallest `periplus.config.json`, `index.mdx` and `*.periplus.ts` that reproduce the problem.
    validations:
      required: true
