version: 2
updates:
  # Dependabot has no `pnpm` ecosystem: `npm` covers pnpm and detects pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /templates/starlight
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      # Astro, its integrations and React move together (peer ranges), majors included;
      # the `site` CI job builds the hub before merge.
      site-stack:
        patterns:
          - astro
          - "@astrojs/*"
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - "@xyflow/react"
      site:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
